name: Deploy to S3

on:
  push:
    branches: [ "master" ]  # Adjust this branch name if necessary.

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.SECRET_ACCESS_KEY }}
          aws-region: us-east-1  # Replace with the region of your S3 bucket.

      - name: Sync files to S3
        run: |
          aws s3 sync . s3://barbarowebsite --exclude ".git/*" --exclude ".github/*"
